services:
  - type: web
    name: kamikapp-beta
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_MODE
        value: beta
      - key: PRESENTATION_DEMO
        value: "0"
      - key: DATA_DIR
        value: /var/data/kamikapp
    disk:
      name: kamikapp-data
      mountPath: /var/data
      sizeGB: 1
