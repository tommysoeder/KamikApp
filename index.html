<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4d4f" />
    <title>KamikApp</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=178" />
    <link rel="manifest" href="manifest.webmanifest?v=178" />
    <link rel="stylesheet" href="styles.css?v=178" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      function showKamikBootError(title, detail) {
        var app = document.getElementById("app");
        if (!app || app.childElementCount) return;
        app.innerHTML = '<section class="login"><div class="login-panel"><h1></h1><p>Recarga la pagina. Si sigue fallando, avisa con este texto:</p><pre style="white-space:pre-wrap"></pre></div></section>';
        app.querySelector("h1").textContent = title;
        app.querySelector("pre").textContent = String(detail || "Error desconocido");
      }
      window.addEventListener("error", function (event) {
        showKamikBootError("Error al cargar KamikApp", event.message);
      });
      window.addEventListener("unhandledrejection", function (event) {
        showKamikBootError("Error al iniciar KamikApp", (event.reason && event.reason.message) || event.reason);
      });
    </script>
    <script src="app.js?v=178"></script>
  </body>
</html>
